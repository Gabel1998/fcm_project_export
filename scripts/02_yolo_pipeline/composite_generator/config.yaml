# === Paths (kan overrides ved kørsel) ===
seed_image_dir: ~/Development/dataset/Corn/images
background_paths:
  - ~/Development/dataset/Corn/Belt1.png
  - ~/Development/dataset/Corn/Belt2.png
output_dir: ~/Development/school/fcm_project_export/data/composite_v1

# === Dataset-skala ===
num_composites: 2000
train_val_split: 0.80
random_seed: 42

# === Composite-størrelse ===
canvas_size: [4096, 2704]   # (width, height) — Belt1's blå zone, Belt2 resizes til match

# === Frø pr. scene ===
seeds_per_composite:
  min: 40
  max: 80

# === Pakkings-strategi ===
packing_strategy_mix:
  scatter: 0.40          # var 0.50
  dense: 0.30
  t_config: 0.30         # var 0.20 — flere L-clusters så de er nemmere at se i preview
packing_gap_pixels: 4
max_placement_attempts: 200

# === Frø-transformation ===
seed_rotation_range: [0, 360]
seed_scale_jitter: [1.0, 1.0]  # dropped: scale-jitter inkompatibel med packing's collision-check (overlap-bug)

# === Rendering ===
shadow:
  enabled: true
  offset_px: [3, 3]
  blur_sigma: 4.0
  opacity: 0.35
edge_feather_px: 1.5

# === Baggrund-augmentation ===
background_random_rotation: true
background_color_jitter: 0.0           # Videometer: fast produktionsbelysning — ingen color-jitter
background_brightness_jitter: 0.0      # Videometer: fast produktionsbelysning — ingen brightness-jitter

# === Output ===
image_format: png
bbox_strategy: tight

# === Validering ===
visualize_n_samples: 8
log_seed_metadata: true
