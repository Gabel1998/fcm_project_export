# Variant: t_heavy — 50% T/L-clusters
#
# Brug: make gen-config CONFIG=t_heavy DATASET=v2_t_heavy
#
# Formål: træn modellen aggressivt på touching-konfigurationer (Videometers
# kerne-udfordring). Halvdelen af alle frø placeres i clusters á 2-3 der rør hinanden.
#
# Forskelle fra default config.yaml:
#   - packing_strategy_mix.t_config: 0.30 → 0.50
#   - scatter reduceret tilsvarende: 0.40 → 0.30
#
# Forventet effekt: model bliver bedre til at separere touching frø, men
# måske dårligere på sparsomt-pakkede scener (ikke trænet nok på dem).

seed_image_dir: ~/Development/dataset/Corn/images
background_paths:
  - ~/Development/dataset/Corn/Belt1.png
  - ~/Development/dataset/Corn/Belt2.png
output_dir: ~/Development/school/fcm_project_export/data/composite_v2_t_heavy

num_composites: 2000
train_val_split: 0.80
random_seed: 42

canvas_size: [4096, 2704]

seeds_per_composite:
  min: 40
  max: 80

packing_strategy_mix:
  scatter: 0.30
  dense: 0.20
  t_config: 0.50          # ← op fra 0.30
packing_gap_pixels: 4
max_placement_attempts: 200

seed_rotation_range: [0, 360]
seed_scale_jitter: [1.0, 1.0]

shadow:
  enabled: true
  offset_px: [3, 3]
  blur_sigma: 4.0
  opacity: 0.35
edge_feather_px: 1.5

background_random_rotation: true
background_color_jitter: 0.0
background_brightness_jitter: 0.0

image_format: png
bbox_strategy: tight

visualize_n_samples: 8
log_seed_metadata: true
